name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Rebuild the index and run the retrieval eval (slow: ~15 min)"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  retrieval-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m lawrag.ingest --rebuild
      # 'full' needs Ollama only for Hindi query translation; without it those queries fall back to raw text.
      - run: python -m evals.retrieval_eval --configs dense hybrid hybrid_rerank full
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: evals/results/
