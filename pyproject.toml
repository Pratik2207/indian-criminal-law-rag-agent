[project]
name = "lawrag"
version = "2.0.0"
description = "Local RAG assistant for Indian criminal law (BNS, BNSS, IPC, CrPC) with linked, verified citations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[tool.setuptools]
packages = ["lawrag"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["archive", "qdrant_db", "qdrant_db_baseline"]
